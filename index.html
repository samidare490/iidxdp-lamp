<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIDX DP Lamp</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>IIDX DP Lamp</h1>
    <div class="chips-container">
        <!-- 初期状態で選択される方に「checked」を付けます -->
        <input type="radio" id="csv1" name="csv-choice" value="11.csv" checked>
        <label for="csv1" class="chip">☆11</label>

        <input type="radio" id="csv2" name="csv-choice" value="12.csv">
        <label for="csv2" class="chip">☆12</label>
    </div>
    <div class="search-container">
        <input type="text" id="search-input" placeholder="曲名で検索...">
        <button id="open-modal-btn" class="stats-btn">📊 統計グラフ</button>
    </div>
    <!-- ここにデータが動的に追加されます -->
    <div id="game-data-container" class="grid-container"></div>

    <div id="stats-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>クリア状況 統計グラフ</h2>
                <button id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            <div class="chart-wrapper">
                <canvas id="statsChart"></canvas>
            </div>
        </div>
    </div>
    
    <!-- モジュールとしてJSを読み込む -->
    <script type="module" src="app.js"></script>
</body>
</html>
